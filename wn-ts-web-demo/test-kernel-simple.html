<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordNet Kernel Simple Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🚀 WordNet Kernel Simple Test</h1>
    <div id="results"></div>

    <script type="module">
        const resultsDiv = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }

        async function testKernel() {
            try {
                addResult('🔄 Testing WordNet Kernel Architecture...', 'info');
                
                // Test 1: Check if React components can be imported
                addResult('📦 Testing React component imports...', 'info');
                
                try {
                    const { useWordNetKernel, WordNetKernelProvider } = await import('./src/react/index.js');
                    addResult('✅ React kernel components imported successfully', 'success');
                } catch (error) {
                    addResult(`❌ Failed to import React components: ${error.message}`, 'error');
                    return;
                }

                // Test 2: Check if core kernel can be imported
                addResult('🏗️ Testing core kernel import...', 'info');
                
                try {
                    const { WebWordNetKernel } = await import('./src/wordnet-kernel.js');
                    addResult('✅ WebWordNetKernel imported successfully', 'success');
                } catch (error) {
                    addResult(`❌ Failed to import WebWordNetKernel: ${error.message}`, 'error');
                }

                // Test 3: Check if core can be imported
                addResult('⚙️ Testing core import...', 'info');
                
                try {
                    const { WebWordNetCore } = await import('./src/wordnet-core.js');
                    addResult('✅ WebWordNetCore imported successfully', 'success');
                } catch (error) {
                    addResult(`❌ Failed to import WebWordNetCore: ${error.message}`, 'error');
                }

                addResult('🎉 All kernel architecture imports successful!', 'success');
                addResult('💡 The kernel architecture is ready to use in the demo!', 'info');
                
            } catch (error) {
                addResult(`❌ Test failed: ${error.message}`, 'error');
            }
        }

        // Run the test
        testKernel();
    </script>
</body>
</html>
