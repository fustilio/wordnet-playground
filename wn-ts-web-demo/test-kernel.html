<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordNet Kernel Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🚀 WordNet Kernel Architecture Test</h1>
    <div id="results"></div>

    <script type="module">
        const resultsDiv = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }

        async function testKernel() {
            try {
                addResult('🔄 Testing WordNet Kernel Architecture...', 'info');
                
                // Test 1: Check if modules can be imported
                addResult('📦 Testing module imports...', 'info');
                
                try {
                    // This will test if the kernel exports are available
                    const { WebWordNetKernel } = await import('./src/wordnet-kernel.js');
                    addResult('✅ WebWordNetKernel imported successfully', 'success');
                } catch (error) {
                    addResult(`❌ Failed to import WebWordNetKernel: ${error.message}`, 'error');
                    return;
                }

                try {
                    const { useWordNetKernel } = await import('./src/react/index.js');
                    addResult('✅ useWordNetKernel hook imported successfully', 'success');
                } catch (error) {
                    addResult(`❌ Failed to import useWordNetKernel: ${error.message}`, 'error');
                }

                try {
                    const { WordNetKernelProvider } = await import('./src/react/index.js');
                    addResult('✅ WordNetKernelProvider imported successfully', 'success');
                } catch (error) {
                    addResult(`❌ Failed to import WordNetKernelProvider: ${error.message}`, 'error');
                }

                // Test 2: Check if kernel can be instantiated
                addResult('🏗️ Testing kernel instantiation...', 'info');
                
                try {
                    const { WebWordNetKernel } = await import('./src/wordnet-kernel.js');
                    const kernel = new WebWordNetKernel('oewn:2024');
                    addResult('✅ WebWordNetKernel instantiated successfully', 'success');
                    
                    // Test 3: Check if plugins are available
                    addResult('🔌 Testing plugin system...', 'info');
                    const plugins = kernel.getPlugins();
                    addResult(`✅ Available plugins: ${plugins.join(', ')}`, 'success');
                    
                    // Test 4: Check if core methods exist
                    addResult('⚙️ Testing core methods...', 'info');
                    const hasWords = typeof kernel.words === 'function';
                    const hasSynsets = typeof kernel.synsets === 'function';
                    const hasGetHypernyms = typeof kernel.getHypernyms === 'function';
                    const hasGetPathSimilarity = typeof kernel.getPathSimilarity === 'function';
                    const hasGetTranslations = typeof kernel.getTranslations === 'function';
                    
                    if (hasWords) addResult('✅ words() method available', 'success');
                    if (hasSynsets) addResult('✅ synsets() method available', 'success');
                    if (hasGetHypernyms) addResult('✅ getHypernyms() method available', 'success');
                    if (hasGetPathSimilarity) addResult('✅ getPathSimilarity() method available', 'success');
                    if (hasGetTranslations) addResult('✅ getTranslations() method available', 'success');
                    
                    addResult('🎉 All kernel architecture tests passed!', 'success');
                    
                } catch (error) {
                    addResult(`❌ Kernel instantiation failed: ${error.message}`, 'error');
                }

            } catch (error) {
                addResult(`❌ Test failed: ${error.message}`, 'error');
            }
        }

        // Run the test
        testKernel();
    </script>
</body>
</html>
